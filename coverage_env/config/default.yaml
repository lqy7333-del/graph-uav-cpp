environment:
  coordinate_system:
    type: WGS84
  num_fields:
    min: 5
    max: 20
  # How the per-episode field count is chosen: `uniform` draws from the range above
  # (maximum variety, but the logged mean then depends on which counts were drawn);
  # `cycle` walks the range in order so every update sees a predictable set. The
  # measured reward difference between 5 and 20 field episodes is ~4 points, larger
  # than a whole long run's improvement, so `cycle` makes the curve comparable.
  num_fields_strategy: uniform
  workspace:
    # ~3.3 km x 2.9 km. Enlarged with the 0.5-3 ha parcels: the scattered layout has to
    # fit 20 of them without overlap, which the previous 1.5 km box could not do.
    min_lat: 31.210
    max_lat: 31.240
    min_lon: 121.455
    max_lon: 121.485
  random_seed: 20261012
  max_episode_steps_per_field: 12

field_generator:
  field_size:
    min_area: 5000.0
    max_area: 20000.0
  shape:
    min_vertices: 3
    max_vertices: 5
    irregularity: 0.22
  min_field_spacing: 15.0
  # Field layout. ``contiguous`` grows a pool of neighbouring parcels separated by
  # ``gap_m`` farm tracks and then randomly selects ``num_fields`` of them, which
  # is how farmland actually looks: a block of adjacent parcels. The previous
  # ``scattered`` behaviour spread fields uniformly over the whole workspace, so
  # 60% of the travelled distance was flying between fields rather than covering
  # them. ``scattered`` is kept so older baselines stay reproducible.
  layout:
    # tessellated: one land block split by straight boundaries into adjacent parcels
    # that share edges -- what real field boundaries look like. Avoids the earlier
    # mistake of scattering independent polygons with gaps between them.
    mode: tessellated
    parcel_gap_m: 1.5
    # Tessellate this many times more parcels than are worked, then keep a random
    # subset: the unworked parcels become the real gaps between worked ones.
    tessellated_oversample: 2.0
    gap_m: 15.0
    # clustered mode: tight parcels inside a block, wide tracks between blocks.
    # Real farmland is asymmetric this way; a uniform lattice leaves the visiting
    # order nothing to exploit (measured: uniform spacing made the order worth ~0).
    cluster_min: 2
    cluster_max: 4
    cluster_inner_gap_m: 4.0
    cluster_gap_m: 90.0
    pool_oversample: 1.5
    growth_attempts: 60
    # Farm headquarters placement. Both the *direction* around the block and the
    # standoff distance are random, so the commute itself is part of what
    # generalises across episodes. A fixed bbox corner put the depot 0-435 m from
    # the nearest parcel (the parcel cluster is irregular, so its bounding box is
    # much larger than the cluster) and only ever on one of four diagonals.
    depot_offset_m:
      min: 50.0
      max: 400.0
  resolution:
    grid_resolution: 10.0

depot:
  type: random
  position: null

uav:
  num_uav: 1
  max_energy: 1500.0
  speed: 8.0
  coverage_width: 10.0
  sensor_width: 5.0
  max_payload: 50.0
  payload_per_area: 0.003
  energy:
    alpha: 0.08
    beta: 0.02
    energy_margin: 0.20
  # Domain randomization: each reset draws a new capability set from these
  # ranges when cross-episode generalization is enabled. Fixed-instance
  # generation (an explicit num_fields) keeps the scalar values above.
  ranges:
    max_energy:
      min: 1200.0
      max: 1800.0
    max_payload:
      min: 40.0
      max: 60.0
    speed:
      min: 6.0
      max: 10.0
    coverage_width:
      min: 8.0
      max: 12.0
    alpha:
      min: 0.06
      max: 0.10
    beta:
      min: 0.016
      max: 0.024
    # Payload spent per square metre of coverage, i.e. how much area one payload
    # can treat. The fixed 0.003 let a 40-60 payload unit UAV cover ~5 parcels;
    # randomising it over 0.002-0.004 doubles that range so the agent has to adapt
    # its ordering to how far its payload actually reaches.
    payload_per_area:
      min: 0.002
      max: 0.004

coverage:
  default_workload: 0.45
  min_workload: 0.01
  max_workload: 0.50

plot:
  show_grid: true
  save_result: true
  show: false
  output_dir: results
  save_gif: false

rl:
  # The configuration executor plans its previews on ``grid_resolution`` and
  # silently falls back to 5 m when it is absent -- four times the cells of the
  # field generator's 10 m grid, for no gain in fidelity. Measured: one env step
  # on the clustered 20-parcel instances took 1.4-2.5 s, dominated by the
  # workload-feasibility previews that call it.
  grid_resolution: 10.0
  gamma: 1.0
  learning_rate: 0.0003
  batch_size: 64
  workload_options: [0.1, 0.2, 0.3, 0.5]
  return_to_depot: true
  # Auto-return + refill when every coverage action becomes infeasible.
  allow_auto_resupply: true
  # Inflate fast feasibility estimates to avoid edge-of-budget false positives.
  fast_estimate_safety_factor: 1.25
  # A failed sampled action is a normal transition; stop a stuck episode after
  # several consecutive failures so training can proceed to the next episode.
  failure_penalty: -1.0
  failure_termination_threshold: 5
  # Reward is -delta_distance / total_area times this constant scale, where
  # total_area is the current episode's discretized coverable area. The scale
  # only lifts the magnitude and never depends on the field count, preserving
  # cross-instance comparability. Measured field-count sweep (5/10/20 fields)
  # gives total_distance/total_area ~= 0.43-0.55, so 100 keeps the episode
  # return at O(10-100) and the critic target easy to fit.
  reward_scale: 100.0
  graph:
    max_area: 8000.0
    max_perimeter: 500.0
    max_boundary_length: 200.0
    # Metric scale for every *position* feature: Field/Boundary node centres and
    # the graph's global uav/depot coordinates. Measured over 60 instances (790
    # fields) the workspace spans only ~2400 m and |centre| peaks at 1253 m, so
    # 10000 compressed the coordinate channels to |mean| 0.045 while their sibling
    # node features sit at 0.38-1.0 -- about 10x under-scaled, leaving the
    # field-to-field coordinate differences (median 0.0675, the actual signal for
    # "which field is nearest") tiny. 1500 m is the smallest scale that clamps
    # nothing (1000 m would clip 6.1% of centres, exactly the far fields) while
    # lifting coordinates to |mean| 0.29 and the pairwise differences to ~0.45.
    # MUST match DEFAULT_SCALES["position_scale_m"] in
    # rl/decoder/global_state_encoder.py (guarded by a test); a mismatch would put
    # node centres and the UAV position in different frames.
    # Re-derived for the contiguous layout: measured over 40 instances the largest
    # |field centroid| is 641 m (the block now sits compactly around the
    # workspace centre), so 800 m is the smallest scale with headroom that does
    # not squash the coordinate channels.
    position_scale_m: 1000.0
    # Scale for the E_BB_inter distance feature (``distance / global_scale``).
    # E_BB_inter only links boundaries closer than ``d_near_m`` (1500 m), so at
    # 10000 the feature could only ever span 0-0.15 -- the same under-scaling
    # that made the coordinate channels useless. 3000 m covers the whole
    # workspace with the ~1500 m neighbourhood inside it.
    # E_BB_inter only links boundaries closer than d_near_m, so setting this equal
    # to d_near_m makes the feature span exactly [0, 1] by construction.
    global_distance_scale_m: 3000.0
    # Scale for the UAV->Field / UAV->Boundary relative offset and distance.
    # Re-derived for the contiguous layout: measured max UAV->candidate distance is
    # 902 m, so 1200 m covers it with headroom.
    uav_distance_scale_m: 2500.0
    d_near_m: 1500.0
    # Normalizers for the UAV capability channels. Each equals the *upper* bound
    # of the matching uav.ranges entry, which is the smallest scale that clips
    # nothing while giving the widest possible normalized span. The previous
    # values (30000/100/20/50) were 1.7-20x too large: max_energy was squashed
    # into a 0.02-wide band, so "how big is this episode's battery" was almost
    # invisible next to payload_ratio (sd 0.006 vs 0.315). Must match
    # DEFAULT_SCALES in rl/decoder/global_state_encoder.py (guarded by a test).
    max_energy_scale: 1800.0
    max_payload_scale: 60.0
    speed_scale: 10.0
    coverage_width_scale: 12.0
    # Capability normalisers for the consumption rates, matched to the uav.ranges
    # upper bounds so the channels span roughly [0.5, 1]. These rates were already
    # randomised per episode but were NOT part of any observation, so the agent
    # could not see how fast it burns energy or payload.
    alpha_scale: 0.10
    beta_scale: 0.024
    payload_per_area_scale: 0.004
  # Factored decode p(field) * p(entry|field) * p(exit|field,entry). A flat
  # softmax over the (field, entry, exit) product space gave the parcel decision
  # only a ~1/14 share of the output, while the entry/exit variants it competed
  # with drive the immediate transit cost -- so most of the gradient went into the
  # part two-opt already showed is good enough. The chain rule keeps the joint
  # distribution and its entropy exact, so PPO and entropy_coef are unchanged.
  decoder:
    hierarchical_decoding: true
    # Cross-candidate interaction: one round of self-attention over the candidate
    # set, so a candidate can be scored knowing what the alternatives are. Without
    # it the only signal shared across candidates is the pooled global vector.
    candidate_attention: true
    attention_heads: 4
  encoder:
    hidden_dim: 128
    num_heads: 4
    dropout: 0.1

# Potential-based reward shaping for the ordering sub-problem: `r' = r +
# gamma*Phi(s') - Phi(s)` with `Phi(s) = -strength * remaining_tour_length(s) /
# total_area`. Phi is 0 once every parcel is covered, so the shaped return differs
# from the true one by the constant `-Phi(s_0)` and the optimal policy is
# unchanged (Ng et al. 1999). Only the learning dynamics change: the ordering
# signal becomes a per-step quantity instead of a difference of distant returns.
# Evaluation always uses the raw environment reward, so results stay comparable.
shaping:
  enable: false
  strength: 1.0

ppo:
  learning_rate: 0.0003
  # Each optimizer gets its own rate. Adam moves a parameter by roughly lr per
  # step, so `lr x steps` bounds how far a network can travel in a whole run.
  # The critic sat at explained_variance ~0 until its rate was raised 10x, so it
  # keeps 10x. The actor was TESTED at 10x (resume ckpt_200 -> 250, 20 fixed
  # instances, paired): delta = -0.83 +- 1.59, t = -0.52, sd 4.62 -> 7.13, i.e.
  # no gain and less consistency. The actor's policy-gradient estimate is noisy,
  # so faster movement chases noise; it stays at the base rate.
  # Both fall back to `learning_rate` when omitted.
  #
  # NOTE: max_grad_norm does NOT limit the step size -- it only rescales the
  # gradient, and Adam is invariant to a uniform rescale.
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.003
  gamma: 1.0
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.01
  # Linear annealing of the entropy bonus: held at `entropy_coef` for the first
  # `entropy_anneal_start` of the run, then decayed to `entropy_coef_end`.
  # Measured motivation: with a constant 0.01 the policy sat at 3.41 nats of
  # entropy after 400 updates, i.e. 77% of the log(84)=4.43 uniform maximum. That
  # both depresses the sampled reward it is logged with and floods the advantage
  # with exploration noise, which is the signal ordering has to come through.
  # Set `entropy_coef_end` to null to disable annealing.
  entropy_coef_end: 0.0
  entropy_anneal_start: 0.25
  # Learning-rate decay, driven by the same run-progress fraction as the entropy
  # bonus. `none` keeps the previous behaviour; `cosine` decays from the configured
  # rate to `lr_final_scale` of it by the last update. Used for long runs so the
  # policy can settle instead of being kept noisy by a constant step size.
  lr_schedule: none
  lr_final_scale: 0.1
  value_coef: 0.5
  epochs: 4
  batch_size: 64
  max_grad_norm: 0.5
