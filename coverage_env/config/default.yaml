environment:
  coordinate_system:
    type: WGS84
  num_fields:
    min: 5
    max: 20
  workspace:
    min_lat: 31.218
    max_lat: 31.232
    min_lon: 121.462
    max_lon: 121.478
  random_seed: 20261012
  max_episode_steps_per_field: 12

field_generator:
  field_size:
    min_area: 1000.0
    max_area: 6000.0
  shape:
    min_vertices: 3
    max_vertices: 5
    irregularity: 0.22
  min_field_spacing: 15.0
  resolution:
    grid_resolution: 10.0

depot:
  type: random
  position: null

uav:
  num_uav: 1
  max_energy: 1500.0
  speed: 8.0
  coverage_width: 10.0
  sensor_width: 5.0
  max_payload: 50.0
  payload_per_area: 0.003
  energy:
    alpha: 0.08
    beta: 0.02
    energy_margin: 0.20
  # Domain randomization: each reset draws a new capability set from these
  # ranges when cross-episode generalization is enabled. Fixed-instance
  # generation (an explicit num_fields) keeps the scalar values above.
  ranges:
    max_energy:
      min: 1200.0
      max: 1800.0
    max_payload:
      min: 40.0
      max: 60.0
    speed:
      min: 6.0
      max: 10.0
    coverage_width:
      min: 8.0
      max: 12.0
    alpha:
      min: 0.06
      max: 0.10
    beta:
      min: 0.016
      max: 0.024

coverage:
  default_workload: 0.45
  min_workload: 0.01
  max_workload: 0.50

plot:
  show_grid: true
  save_result: true
  show: false
  output_dir: results
  save_gif: false

rl:
  gamma: 0.99
  learning_rate: 0.0003
  batch_size: 64
  workload_options: [0.1, 0.2, 0.3, 0.5]
  return_to_depot: true
  # Auto-return + refill when every coverage action becomes infeasible.
  allow_auto_resupply: true
  # Inflate fast feasibility estimates to avoid edge-of-budget false positives.
  fast_estimate_safety_factor: 1.25
  # A failed sampled action is a normal transition; stop a stuck episode after
  # several consecutive failures so training can proceed to the next episode.
  failure_penalty: -1.0
  failure_termination_threshold: 5
  # Reward is -delta_distance / total_area times this constant scale, where
  # total_area is the current episode's discretized coverable area. The scale
  # only lifts the magnitude and never depends on the field count, preserving
  # cross-instance comparability. Measured field-count sweep (5/10/20 fields)
  # gives total_distance/total_area ~= 0.43-0.55, so 100 keeps the episode
  # return at O(10-100) and the critic target easy to fit.
  reward_scale: 100.0
  graph:
    max_area: 8000.0
    max_perimeter: 500.0
    max_boundary_length: 200.0
    # Metric scale for every *position* feature: Field/Boundary node centres and
    # the graph's global uav/depot coordinates. Measured over 60 instances (790
    # fields) the workspace spans only ~2400 m and |centre| peaks at 1253 m, so
    # 10000 compressed the coordinate channels to |mean| 0.045 while their sibling
    # node features sit at 0.38-1.0 -- about 10x under-scaled, leaving the
    # field-to-field coordinate differences (median 0.0675, the actual signal for
    # "which field is nearest") tiny. 1500 m is the smallest scale that clamps
    # nothing (1000 m would clip 6.1% of centres, exactly the far fields) while
    # lifting coordinates to |mean| 0.29 and the pairwise differences to ~0.45.
    # MUST match DEFAULT_SCALES["position_scale_m"] in
    # rl/decoder/global_state_encoder.py (guarded by a test); a mismatch would put
    # node centres and the UAV position in different frames.
    position_scale_m: 1500.0
    global_distance_scale_m: 10000.0
    d_near_m: 1500.0
  encoder:
    hidden_dim: 128
    num_heads: 4
    dropout: 0.1

ppo:
  learning_rate: 0.0003
  # Each optimizer gets its own rate. Adam moves a parameter by roughly lr per
  # step, so `lr x steps` bounds how far a network can travel in a whole run.
  # The critic sat at explained_variance ~0 until its rate was raised 10x, so it
  # keeps 10x. The actor was TESTED at 10x (resume ckpt_200 -> 250, 20 fixed
  # instances, paired): delta = -0.83 +- 1.59, t = -0.52, sd 4.62 -> 7.13, i.e.
  # no gain and less consistency. The actor's policy-gradient estimate is noisy,
  # so faster movement chases noise; it stays at the base rate.
  # Both fall back to `learning_rate` when omitted.
  #
  # NOTE: max_grad_norm does NOT limit the step size -- it only rescales the
  # gradient, and Adam is invariant to a uniform rescale.
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  epochs: 4
  batch_size: 64
  max_grad_norm: 0.5
